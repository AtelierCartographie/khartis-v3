version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - svelte*
          - "@sveltejs/*"
      carbon:
        patterns:
          - carbon-*
          - "@carbon/*"
      duckdb:
        patterns:
          - "@duckdb/*"
      deck-gl:
        patterns:
          - "@deck.gl/*"
          - "@luma.gl/*"
          - "@loaders.gl/*"
      maplibre:
        patterns:
          - maplibre-gl
      dev-tools:
        patterns:
          - vite*
          - vitest*
          - "@playwright/*"
          - playwright*
          - eslint*
          - prettier*
          - typescript*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
