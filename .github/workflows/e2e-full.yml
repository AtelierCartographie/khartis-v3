name: Full E2E Regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

concurrency:
  group: full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: E2E Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run full Playwright suite
        run: pnpm run test:e2e:full
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build full HTML report
        if: always()
        run: |
          if [ -d "blob-report" ]; then
            npx playwright merge-reports --reporter html,markdown ./blob-report
          fi

      - name: Upload full HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full-nightly-${{ github.run_attempt }}
          path: |
            playwright-report
            report.md
          if-no-files-found: ignore
          retention-days: 14
