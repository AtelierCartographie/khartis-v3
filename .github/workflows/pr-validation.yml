name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - staging
      - main
  merge_group:
    types:
      - checks_requested

env:
  NODE_VERSION: '22'

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for private dependencies
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GEOARROW_SSH_KEY }}" > ~/.ssh/geoarrow_key
          echo "${{ secrets.PROJ_SSH_KEY }}" > ~/.ssh/proj_key
          chmod 600 ~/.ssh/geoarrow_key ~/.ssh/proj_key
          cat >> ~/.ssh/config << 'EOF'
          Host github-geoarrow
            HostName github.com
            User git
            IdentityFile ~/.ssh/geoarrow_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          Host github-proj
            HostName github.com
            User git
            IdentityFile ~/.ssh/proj_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          git config --global url."git@github-geoarrow:AtelierCartographie/geoarrow-deck-stream".insteadOf "git@github.com:AtelierCartographie/geoarrow-deck-stream"
          git config --global url."git@github-proj:AtelierCartographie/proj-suggest".insteadOf "git@github.com:AtelierCartographie/proj-suggest"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run pipeline tests
        run: pnpm test:pipeline

      - name: Run DuckDB tests
        run: pnpm test:duckdb

      - name: Build application
        run: pnpm build
