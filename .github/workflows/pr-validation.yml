name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - staging
      - main

env:
  NODE_VERSION: '22'

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm run test:unit -- --run

      - name: Build application
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            build
            .svelte-kit/output
          retention-days: 1

  e2e-smoke:
    name: E2E Smoke
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E tests
        run: pnpm run test:e2e
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build smoke HTML report
        if: always()
        run: |
          if [ -d "blob-report" ]; then
            npx playwright merge-reports --reporter html,markdown ./blob-report
          fi

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            report.md
          if-no-files-found: ignore
          retention-days: 7

  e2e-full:
    name: E2E Full
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run full E2E tests
        run: pnpm run test:e2e:full
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build full HTML report
        if: always()
        run: |
          if [ -d "blob-report" ]; then
            npx playwright merge-reports --reporter html,markdown ./blob-report
          fi

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            playwright-report
            report.md
          if-no-files-found: ignore
          retention-days: 7

  pr-validation-complete:
    name: PR Validation Complete
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [quality-checks, e2e-smoke, e2e-full]
    runs-on: ubuntu-latest
    steps:
      - name: Final gate
        run: |
          QUALITY="${{ needs.quality-checks.result }}"
          SMOKE="${{ needs.e2e-smoke.result }}"
          FULL="${{ needs.e2e-full.result }}"

          echo "quality-checks: $QUALITY"
          echo "e2e-smoke: $SMOKE"
          echo "e2e-full: $FULL"

          if [ "$QUALITY" != "success" ] || [ "$SMOKE" != "success" ] || [ "$FULL" != "success" ]; then
            exit 1
          fi
