name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - staging
      - main
  merge_group:
    types:
      - checks_requested

env:
  NODE_VERSION: '22'

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm check

      - name: Run pipeline tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm exec vitest run --project server tests/pipeline

      - name: Run DuckDB tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm exec vitest run --project server tests/duckdb

      - name: Build application
        run: pnpm build

  e2e-tests:
    name: E2E Tests (Playwright)
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e
