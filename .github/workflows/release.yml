name: Release Automation

on:
  push:
    branches:
      - staging
      - main

env:
  NODE_VERSION: '22'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for private dependencies
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GEOARROW_SSH_KEY }}" > ~/.ssh/geoarrow_key
          echo "${{ secrets.PROJ_SSH_KEY }}" > ~/.ssh/proj_key
          chmod 600 ~/.ssh/geoarrow_key ~/.ssh/proj_key
          cat >> ~/.ssh/config << 'EOF'
          Host github-geoarrow
            HostName github.com
            User git
            IdentityFile ~/.ssh/geoarrow_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          Host github-proj
            HostName github.com
            User git
            IdentityFile ~/.ssh/proj_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          git config --global url."git@github-geoarrow:AtelierCartographie/geoarrow-deck-stream".insteadOf "git@github.com:AtelierCartographie/geoarrow-deck-stream"
          git config --global url."git@github-proj:AtelierCartographie/proj-suggest".insteadOf "git@github.com:AtelierCartographie/proj-suggest"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Run server tests (pipeline + duckdb)
        run: pnpm run test:pipeline

      - name: Run semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
