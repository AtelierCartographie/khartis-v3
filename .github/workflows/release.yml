name: Release Automation

on:
  push:
    branches:
      - staging
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: read

  semantic-release:
    name: Semantic Release (${{ github.ref_name }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The release reads commits, tags and notes, not the data files.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: |
            /*
            !/static/basemaps/**/*.parquet
            !/tests-datasets/
          sparse-checkout-cone-mode: false

      - name: Configure git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch semantic-release notes
        run: git fetch origin 'refs/notes/semantic-release:refs/notes/semantic-release' || true

      - uses: ./.github/actions/setup

      - name: Run semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
