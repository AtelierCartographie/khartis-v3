<!doctype html>

<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <script id="khartis-pwa-reset">
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (!params.has('reset')) return;
          var appBasePath = '%sveltekit.assets%';
          var appScope = new URL(
            (appBasePath || '') + '/',
            window.location.origin
          ).href;
          var scopePath = new URL(appScope).pathname.replace(/\/+$/, '') || '/';
          var cachePrefix = 'khartis:' + encodeURIComponent(scopePath) + ':';
          document.documentElement.style.background = '#ffffff';
          try {
            window.sessionStorage.setItem(
              cachePrefix + 'reset-skip-restore',
              '1'
            );
          } catch (flagError) {
            console.error('Khartis reset flag persistence failed', flagError);
          }
          var clearSw =
            'serviceWorker' in navigator
              ? navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    return Promise.all(
                      regs
                        .filter(function (r) {
                          return r.scope === appScope;
                        })
                        .map(function (r) {
                          return r.unregister();
                        })
                    );
                  })
                  .catch(function (error) {
                    console.error(
                      'Khartis reset service worker cleanup failed',
                      error
                    );
                  })
              : Promise.resolve();
          var clearCaches =
            'caches' in window
              ? caches
                  .keys()
                  .then(function (keys) {
                    return Promise.all(
                      keys
                        .filter(function (k) {
                          return k.indexOf(cachePrefix) === 0;
                        })
                        .map(function (k) {
                          return caches.delete(k);
                        })
                    );
                  })
                  .catch(function (error) {
                    console.error('Khartis reset cache cleanup failed', error);
                  })
              : Promise.resolve();
          Promise.all([clearSw, clearCaches]).then(function () {
            var url = new URL(window.location.href);
            url.searchParams.delete('reset');
            window.location.replace(url.pathname + url.search + url.hash);
          });
        } catch (error) {
          console.error('Khartis reset bootstrap failed', error);
        }
      })();
    </script>
    <script id="khartis-stale-asset-recovery">
      (function () {
        var recoveryScopePath =
          ('%sveltekit.assets%' || '').replace(/\/+$/, '') || '/';
        var recoveryKeyPrefix =
          'khartis:' + encodeURIComponent(recoveryScopePath) + ':';
        var RELOAD_GUARD_KEY = recoveryKeyPrefix + 'auto-reloaded-at';
        var RESET_GUARD_KEY = recoveryKeyPrefix + 'auto-reset-at';
        var RELOAD_GUARD_WINDOW_MS = 5 * 60 * 1000;
        var recoveryScheduled = false;
        var STALE_ASSET_PATTERNS = [
          'failed to fetch dynamically imported module',
          'importing a module script failed',
          'error loading dynamically imported module',
          'loading chunk',
          'failed to load module script',
          'expected a javascript-or-wasm module script',
          'failed to load worker script',
          'webassembly.compile',
          'webassembly.instantiate',
          'mime type'
        ];
        var CRITICAL_RESOURCE_PATTERNS = [
          '/_app/immutable/',
          '.worker.js',
          '.wasm'
        ];

        function getMessage(reason) {
          if (!reason) return '';
          if (typeof reason === 'string') return reason;
          if (reason.message) return String(reason.message);
          return String(reason);
        }

        function isStaleAssetError(reason) {
          var message = getMessage(reason).toLowerCase();
          return STALE_ASSET_PATTERNS.some(function (pattern) {
            return message.indexOf(pattern) !== -1;
          });
        }

        function isCriticalResourceError(event) {
          var target = event && event.target;
          var resourceUrl =
            (target && (target.src || target.href)) ||
            (event && event.filename) ||
            '';
          var normalizedUrl = String(resourceUrl).toLowerCase();
          return CRITICAL_RESOURCE_PATTERNS.some(function (pattern) {
            return normalizedUrl.indexOf(pattern) !== -1;
          });
        }

        function isRecentRecovery(timestamp, now) {
          return (
            Number.isFinite(timestamp) &&
            timestamp > 0 &&
            now - timestamp < RELOAD_GUARD_WINDOW_MS
          );
        }

        function resetWithCacheCleanup() {
          var url = new URL(window.location.href);
          url.searchParams.set('reset', '1');
          window.location.replace(url.pathname + url.search + url.hash);
        }

        function runRecoveryAfterConfirmedSave(recovery) {
          var flushBeforeRecovery = window.__khartisFlushBeforePwaRecovery;
          if (typeof flushBeforeRecovery !== 'function') {
            recovery();
            return;
          }

          Promise.resolve()
            .then(function () {
              return flushBeforeRecovery();
            })
            .then(function (saveConfirmed) {
              if (!saveConfirmed) {
                recoveryScheduled = false;
                console.error(
                  'Khartis stale asset recovery stopped because the project save was not confirmed'
                );
                return;
              }
              recovery();
            })
            .catch(function (error) {
              recoveryScheduled = false;
              console.error(
                'Khartis stale asset recovery stopped because the project save failed',
                error
              );
            });
        }

        function recoverFromStaleAsset() {
          if (recoveryScheduled) return false;
          try {
            var now = Date.now();
            var lastReload = Number(
              window.sessionStorage.getItem(RELOAD_GUARD_KEY) || '0'
            );
            var lastReset = Number(
              window.sessionStorage.getItem(RESET_GUARD_KEY) || '0'
            );
            if (isRecentRecovery(lastReset, now)) {
              console.error(
                'Khartis stale asset recovery stopped to prevent a reload loop'
              );
              return false;
            }

            recoveryScheduled = true;
            if (isRecentRecovery(lastReload, now)) {
              runRecoveryAfterConfirmedSave(function () {
                window.sessionStorage.setItem(RESET_GUARD_KEY, String(now));
                resetWithCacheCleanup();
              });
              return true;
            }

            runRecoveryAfterConfirmedSave(function () {
              window.sessionStorage.setItem(RELOAD_GUARD_KEY, String(now));
              window.location.reload();
            });
            return true;
          } catch (error) {
            console.error(
              'Khartis stale asset recovery guard failed; automatic reload disabled',
              error
            );
            return false;
          }
        }

        window.addEventListener('vite:preloadError', function (event) {
          if (recoverFromStaleAsset()) event.preventDefault();
        });

        window.addEventListener('unhandledrejection', function (event) {
          if (!isStaleAssetError(event.reason)) return;
          if (recoverFromStaleAsset()) event.preventDefault();
        });

        window.addEventListener(
          'error',
          function (event) {
            if (
              !isStaleAssetError(event.error || event.message) &&
              !isCriticalResourceError(event)
            ) {
              return;
            }
            if (recoverFromStaleAsset()) event.preventDefault();
          },
          true
        );
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%app.name%" />
    <meta name="theme-color" content="#ffffff" />

    <title>%app.name%</title>
    <meta name="description" content="%app.description%" />

    <base href="%sveltekit.assets%/" />

    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="%sveltekit.assets%/logo-khartis.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon-180x180.png"
    />

    <link rel="sitemap" href="%sveltekit.assets%/sitemap.xml" />

    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
