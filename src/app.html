<!doctype html>

<html lang="%paraglide.lang%">
  <head>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (!params.has('reset')) return;
          document.documentElement.style.background = '#ffffff';
          var clearSw =
            'serviceWorker' in navigator
              ? navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    return Promise.all(
                      regs.map(function (r) {
                        return r.unregister();
                      })
                    );
                  })
                  .catch(function () {})
              : Promise.resolve();
          var clearCaches =
            'caches' in window
              ? caches
                  .keys()
                  .then(function (keys) {
                    return Promise.all(
                      keys.map(function (k) {
                        return caches.delete(k);
                      })
                    );
                  })
                  .catch(function () {})
              : Promise.resolve();
          Promise.all([clearSw, clearCaches]).then(function () {
            var url = new URL(window.location.href);
            url.searchParams.delete('reset');
            window.location.replace(url.pathname + url.search + url.hash);
          });
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%app.name%" />
    <meta name="theme-color" content="#ffffff" />

    <title>Khartis</title>
    <meta
      name="description"
      content="Khartis — outil de cartographie thématique en ligne par l'Atelier de cartographie de Sciences Po. Créez des cartes thématiques directement dans votre navigateur."
    />

    <base href="%sveltekit.assets%/" />

    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="%sveltekit.assets%/logo-khartis.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon-180x180.png"
    />

    <link rel="sitemap" href="%sveltekit.assets%/sitemap.xml" />

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
