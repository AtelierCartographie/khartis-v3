<!doctype html>

<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Khartis" />
    <meta name="theme-color" content="#ffffff" />

    <title>Khartis</title>
    <meta
      name="description"
      content="Khartis — outil de cartographie thématique en ligne par l'Atelier de cartographie de Sciences Po. Créez des cartes thématiques directement dans votre navigateur."
    />

    <base href="%sveltekit.assets%/" />

    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="%sveltekit.assets%/logo-khartis.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon-180x180.png"
    />

    <link rel="sitemap" href="%sveltekit.assets%/sitemap.xml" />

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Analytics: uncomment and configure when TASK-002 is complete -->
    <!-- Script will only track if consent is given (managed by consent-banner.svelte) -->
  </body>
</html>
